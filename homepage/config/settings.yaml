# ──────────────────────────────────────────────────────────────
#  Homepage – general settings (demo)
#  https://gethomepage.dev/configs/settings
# ──────────────────────────────────────────────────────────────

title: Homelab Command Deck
description: Homelab Command Deck – self-hosted dashboard demo · Selbst gehostetes Dashboard (Demo)
language: de       # UI texts are German

# Tab icon: spiral galaxy (SVG inline as data URI)
favicon: "data:image/svg+xml;base64,"

# Look ----------------------------------------------------------
theme: dark
color: slate
iconStyle: theme
statusStyle: dot        # status as a dot instead of "Up …"
hideErrors: true
hideVersion: true       # no "v2.x … update available" footer
disableIndexing: true

# ──────────────────────────────────────────────────────────────
#  Layout / groups
#  The ORDER and the ICONS matter: custom.css places every group
#  by the icon of its header (".../<icon>.svg"), not by its name.
#  Changing an icon means updating the matching anchor in custom.css.
#  Bookmark groups listed here get a header icon and join the grid.
# ──────────────────────────────────────────────────────────────
layout:
  Fotos:
    icon: mdi-image-multiple
    style: row
    columns: 2
  Dateien & Dokumente:
    icon: mdi-folder-file
    style: row
    columns: 3
  Netzwerk & Security:
    icon: mdi-network
    style: row
    columns: 2
  Werkzeuge:
    icon: mdi-wrench
    style: row
    columns: 2
  Server & Monitoring:
    icon: mdi-monitor
    style: row
    columns: 2

  # Bookmark groups (quick-start dock)
  Videos:
    icon: mdi-play-circle-outline
  Shopping:
    icon: mdi-cart-outline
  Shop-Check:
    icon: mdi-shield-check-outline
  3D-Modelle:
    icon: mdi-printer-3d-nozzle
  Gaming:
    icon: mdi-crosshairs-gps
  Arbeit:
    icon: mdi-briefcase-outline
