# Gaming: sub-groups = columns (sub-column block in custom.css; titles in the KONFIG
# block --gx-sub1..4). The ORDER matters: 2 links per column, the column title hangs on the
# first link of each column.
#   Shops (Steam, GOG) | Mehr Shops (Epic Games, itch.io)
#   Kompatibilität (ProtonDB, PCGW) | Deals & Zeit (SteamDB, HLTB)
- Gaming:
    # --- Shops ---
    - Steam:
        - icon: steam.png
          abbr: ST
          href: https://store.steampowered.com/
          description: Spiele-Shop
    - GOG:
        - icon: si-gogdotcom
          abbr: GO
          href: https://www.gog.com/
          description: DRM-frei
    # --- Mehr Shops ---
    - Epic Games:
        - icon: epic-games.png
          abbr: EP
          href: https://store.epicgames.com/
          description: Gratisspiele
    - itch.io:
        - icon: si-itchdotio
          abbr: IT
          href: https://itch.io/
          description: Indie
    # --- Kompatibilität ---
    - ProtonDB:
        - icon: protondb.png
          abbr: PD
          href: https://www.protondb.com/
          description: Linux-Check
    - PCGW:
        - icon: si-pcgamingwiki
          abbr: PW
          href: https://www.pcgamingwiki.com/
          description: Fixes
    # --- Deals & Zeit ---
    - SteamDB:
        - icon: si-steamdb
          abbr: SD
          href: https://steamdb.info/
          description: Preisverlauf
    - HLTB:
        - icon: mdi-timer-outline
          abbr: HB
          href: https://howlongtobeat.com/
          description: Spielzeit

