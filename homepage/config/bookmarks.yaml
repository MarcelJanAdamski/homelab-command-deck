# Example (mock) data for the demo – not a real setup.
---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/bookmarks
# Rendered as a "quick-start dock" (pill buttons) by custom.css.
# Every link: icon + 2-letter abbr (unique per group, shown if the icon fails) + ONE short
# description word (also hides the "www." host line). Link counts per group matter for the layout.

