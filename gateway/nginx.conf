# Homelab Command Deck gateway
#
# One public port. The dashboard panels fetch same-origin paths, so this gateway IS required:
#   /                       -> homepage (gethomepage)
#   /sprit/*  /claude/*  /muell/*  -> the three sidecars (prefix stripped)
#   /dwd/s31fg.json         -> DWD pollen forecast (opendata.dwd.de, no CORS headers upstream)
#
# Upstreams are resolved at request time through Docker's embedded DNS (127.0.0.11) and set via
# variables, so nginx starts even if a sidecar is not up yet (it answers 502 until it is).

# small cache for the DWD file (it changes once a day)
proxy_cache_path /var/cache/nginx/dwd levels=1 keys_zone=dwd:1m max_size=5m inactive=12h use_temp_path=off;

gzip on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

# websocket upgrade passthrough (harmless for plain requests)
map $http_upgrade $gx_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 3s;

    # Basic hardening headers. Deliberately NO Content-Security-Policy: Homepage needs inline scripts
    # and custom.js talks to api.open-meteo.com. A location with its own add_header drops these
    # (see /dwd below). The proxy_hide_header lines avoid duplicates if an upstream sets them too.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    # keep the Host the browser used, e.g. "localhost:3000" (checked by HOMEPAGE_ALLOWED_HOSTS)
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $gx_connection;
    # NOTE: a location that sets its own proxy_set_header drops all of these (see /dwd below)
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # liveness of the gateway itself (Docker healthcheck)
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- sidecars -------------------------------------------------------------------------
    location /sprit/ {
        set $up_sprit sprit-tracker:8080;
        rewrite ^/sprit/(.*)$ /$1 break;
        proxy_pass http://$up_sprit;
    }

    location /claude/ {
        set $up_claude claude-usage:8080;
        rewrite ^/claude/(.*)$ /$1 break;
        proxy_pass http://$up_claude;
    }

    location /muell/ {
        set $up_muell muell-tracker:8080;
        rewrite ^/muell/(.*)$ /$1 break;
        proxy_pass http://$up_muell;
    }

    # ---- DWD pollen forecast (public open data) --------------------------------------------
    location = /dwd/s31fg.json {
        set $up_dwd opendata.dwd.de;
        proxy_pass https://$up_dwd/climate_environment/health/alerts/s31fg.json;
        proxy_set_header Host opendata.dwd.de;
        proxy_set_header Accept-Encoding "";
        proxy_ssl_server_name on;
        proxy_ssl_name opendata.dwd.de;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_cache dwd;
        proxy_cache_valid 200 30m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
    }

    # ---- dashboard -------------------------------------------------------------------------
    location / {
        set $up_home homepage:3000;
        proxy_pass http://$up_home;
    }
}
